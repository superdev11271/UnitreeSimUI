<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' ws: wss:; img-src 'self' blob: data:"
    />
    <title>Unitree B2 Simulator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="titlebar">
        <div class="titlebar-brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-text">Unitree B2 Simulator</span>
        </div>
        <div class="titlebar-drag">
          <time class="titlebar-clock" id="titlebar-clock"></time>
        </div>
        <div class="window-controls">
          <button class="window-btn" id="btn-minimize" type="button" aria-label="Minimize">
            <svg viewBox="0 0 12 12"><path d="M2 6h8" /></svg>
          </button>
          <button class="window-btn" id="btn-maximize" type="button" aria-label="Maximize">
            <svg viewBox="0 0 12 12"><rect x="2.5" y="2.5" width="7" height="7" rx="1" /></svg>
          </button>
          <button class="window-btn window-btn-close" id="btn-close" type="button" aria-label="Close">
            <svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3L3 9" /></svg>
          </button>
        </div>
      </header>

      <main class="main-view" id="workspace">
        <div class="world-view-toolbar" aria-label="World viewer controls">
          <button
            class="world-view-icon-btn"
            id="world-view-mode-btn"
            type="button"
            disabled
            aria-label="Transparent view"
            aria-pressed="false"
          >
            <svg class="world-view-icon world-view-icon-solid" viewBox="0 0 16 16" aria-hidden="true">
              <path fill="currentColor" d="M8 2.25 13.25 5.5v5L8 13.75 2.75 10.5v-5z" />
            </svg>
            <svg class="world-view-icon world-view-icon-outline" viewBox="0 0 16 16" aria-hidden="true">
              <path
                fill="none"
                stroke="currentColor"
                stroke-width="1.2"
                stroke-linejoin="round"
                d="M8 2.25 13.25 5.5v5L8 13.75 2.75 10.5v-5L8 2.25z"
              />
            </svg>
          </button>
          <button
            class="world-view-icon-btn is-robot-view"
            id="world-robot-view-btn"
            type="button"
            aria-label="Axis view"
            aria-pressed="true"
          >
            <svg class="world-view-icon world-view-icon-axis" viewBox="0 0 16 16" aria-hidden="true">
              <path fill="none" stroke="#ff3b30" stroke-width="1.2" stroke-linecap="round" d="M8 8.5V3.25" />
              <path fill="none" stroke="#34c759" stroke-width="1.2" stroke-linecap="round" d="M8 8.5 12.25 10.75" />
              <path fill="none" stroke="#007aff" stroke-width="1.2" stroke-linecap="round" d="M8 8.5 3.75 10.75" />
            </svg>
            <svg class="world-view-icon world-view-icon-robot" viewBox="0 0 16 16" aria-hidden="true">
              <rect
                x="4.25"
                y="5.25"
                width="7.5"
                height="4.25"
                rx="1.1"
                fill="none"
                stroke="currentColor"
                stroke-width="1.2"
              />
              <circle cx="5.5" cy="10.75" r="0.9" fill="currentColor" />
              <circle cx="10.5" cy="10.75" r="0.9" fill="currentColor" />
              <circle cx="5.5" cy="12.35" r="0.75" fill="currentColor" />
              <circle cx="10.5" cy="12.35" r="0.75" fill="currentColor" />
            </svg>
          </button>
          <button class="world-view-icon-btn" id="world-focus-robot-btn" type="button" aria-label="Focus robot">
            <svg class="world-view-icon" viewBox="0 0 16 16" aria-hidden="true">
              <circle cx="8" cy="8" r="2.25" fill="none" stroke="currentColor" stroke-width="1.2" />
              <path
                fill="none"
                stroke="currentColor"
                stroke-width="1.2"
                stroke-linecap="round"
                d="M8 2.25v2.25M8 11.5v2.25M2.25 8h2.25M11.5 8h2.25"
              />
            </svg>
          </button>
          <button
            class="world-view-icon-btn"
            id="world-follow-btn"
            type="button"
            aria-label="Follow robot"
            aria-pressed="false"
          >
            <svg class="world-view-icon world-view-icon-free" viewBox="0 0 16 16" aria-hidden="true">
              <path
                fill="none"
                stroke="currentColor"
                stroke-width="1.2"
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M3.75 5.75V3.75h2M10.25 3.75h2v2M12.25 10.25v2h-2M5.75 12.25h-2v-2"
              />
            </svg>
            <svg class="world-view-icon world-view-icon-follow" viewBox="0 0 16 16" aria-hidden="true">
              <path
                fill="none"
                stroke="currentColor"
                stroke-width="1.2"
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M3.75 5.75V3.75h2M10.25 3.75h2v2M12.25 10.25v2h-2M5.75 12.25h-2v-2"
              />
              <circle cx="8" cy="8" r="1.35" fill="currentColor" />
            </svg>
          </button>
          <button
            class="world-view-icon-btn"
            id="world-controls-toggle-btn"
            type="button"
            aria-label="Show controls"
            aria-pressed="false"
          >
            <svg class="world-view-icon world-view-icon-controls-on" viewBox="0 0 16 16" aria-hidden="true">
              <rect x="3.25" y="3.25" width="3.25" height="3.25" rx="0.6" fill="currentColor" />
              <rect x="9.5" y="3.25" width="3.25" height="3.25" rx="0.6" fill="currentColor" />
              <rect x="3.25" y="9.5" width="3.25" height="3.25" rx="0.6" fill="currentColor" />
              <rect x="9.5" y="9.5" width="3.25" height="3.25" rx="0.6" fill="currentColor" />
            </svg>
            <svg class="world-view-icon world-view-icon-controls-off" viewBox="0 0 16 16" aria-hidden="true">
              <path
                fill="none"
                stroke="currentColor"
                stroke-width="1.2"
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M4 11.5h8M6.5 8.5 8 6.5 9.5 8.5"
              />
            </svg>
          </button>
        </div>
        <div id="world-viewer" class="world-viewer-host" aria-label="World model preview"></div>
        <p class="world-status" id="world-status">
          <span class="sensor-status-dot is-waiting" aria-hidden="true"></span>
          <span class="sensor-status-text">Loading world model…</span>
        </p>
        <div class="robot-controls is-hidden" id="robot-controls" aria-label="Robot controls">
          <div class="robot-cmd-group robot-cmd-group-left">
            <div class="robot-cmd-row">
              <button class="robot-cmd-btn" type="button" data-cmd="speed-normal">Normal</button>
              <button class="robot-cmd-btn" type="button" data-cmd="select">Select</button>
            </div>
            <div class="robot-cmd-row">
              <button class="robot-cmd-btn" type="button" data-cmd="speed-fast">Fast</button>
              <button class="robot-cmd-btn" type="button" data-cmd="start">Start</button>
            </div>
          </div>
          <div class="joystick" id="move-joystick" aria-label="Robot move joystick">
            <div class="joystick-base">
              <span class="joystick-arrow joystick-arrow-up" aria-hidden="true">
                <svg viewBox="0 0 12 12"><path d="M6 2.5 10 8H2z" /></svg>
              </span>
              <span class="joystick-arrow joystick-arrow-down" aria-hidden="true">
                <svg viewBox="0 0 12 12"><path d="M6 9.5 2 4h8z" /></svg>
              </span>
              <span class="joystick-arrow joystick-arrow-left" aria-hidden="true">
                <svg viewBox="0 0 12 12"><path d="M2.5 6 8 2v8z" /></svg>
              </span>
              <span class="joystick-arrow joystick-arrow-right" aria-hidden="true">
                <svg viewBox="0 0 12 12"><path d="M9.5 6 4 2v8z" /></svg>
              </span>
              <div class="joystick-knob"></div>
            </div>
          </div>
          <div class="robot-cmd-group robot-cmd-group-right">
            <div class="robot-cmd-row">
              <button class="robot-cmd-btn" type="button" data-cmd="stand-down">Stand Down</button>
              <button
                class="robot-cmd-btn robot-mode-toggle"
                id="robot-mode-toggle"
                type="button"
                aria-pressed="false"
                aria-label="Motion mode"
              >
                Mode
              </button>
            </div>
            <div class="robot-cmd-row">
              <button class="robot-cmd-btn" type="button" data-cmd="stand-up">Stand Up</button>
              <button class="robot-cmd-btn robot-reset-btn" id="btn-reset-simulation" type="button">
                Reset
              </button>
            </div>
          </div>
        </div>
      </main>
    </div>

    <div class="dialog-overlay hidden" id="reset-dialog" aria-hidden="true">
      <div class="reset-dialog" role="dialog" aria-labelledby="reset-dialog-title" aria-modal="true">
        <header class="reset-dialog-header">
          <h3 id="reset-dialog-title">Reset Simulation</h3>
          <button class="reset-dialog-close" id="reset-dialog-close" type="button" aria-label="Close">×</button>
        </header>
        <div class="reset-dialog-body">
          <p class="reset-dialog-desc">
            Save robot spawn points and reset the simulator to any saved pose, or to the current pose when nothing is selected.
          </p>
          <div class="reset-dialog-section">
            <label class="reset-dialog-label" for="reset-position-name">Position name</label>
            <input
              class="reset-dialog-input"
              id="reset-position-name"
              type="text"
              maxlength="64"
              placeholder="Optional name for save"
              autocomplete="off"
            />
          </div>
          <div class="reset-dialog-actions-row">
            <button class="reset-dialog-btn" id="reset-save-position" type="button">Save current position</button>
            <button class="reset-dialog-btn reset-dialog-btn-danger" id="reset-delete-position" type="button" disabled>
              Delete selected
            </button>
          </div>
          <div class="reset-dialog-section">
            <p class="reset-dialog-label">Saved positions</p>
            <div class="reset-position-list" id="reset-position-list"></div>
          </div>
          <p class="reset-dialog-message" id="reset-dialog-message" aria-live="polite"></p>
          <div class="reset-dialog-footer">
            <button class="reset-dialog-btn" id="reset-cancel" type="button">Cancel</button>
            <button class="reset-dialog-btn reset-dialog-btn-primary" id="reset-confirm" type="button">
              Reset simulation
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="app-toast hidden" id="app-toast" role="status" aria-live="polite">
      <span class="app-toast-icon" id="app-toast-icon" aria-hidden="true"></span>
      <span class="app-toast-text" id="app-toast-text"></span>
      <span class="app-toast-progress" id="app-toast-progress" aria-hidden="true"></span>
    </div>

    <script src="../../node_modules/roslib/build/roslib.min.js"></script>
    <script src="sensor-status.js"></script>
    <script src="app-toast.js"></script>
    <script src="robot-control.js"></script>
    <script src="reset-simulation.js"></script>
    <script src="renderer.js"></script>
    <script src="world-viewer.bundle.js"></script>
    <script src="ros-shared.js"></script>
  </body>
</html>
