<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' ws: wss:; img-src 'self' blob: data:"
    />
    <title>Unitree B2 Simulator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="titlebar">
        <div class="titlebar-brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-text">Unitree B2 Simulator</span>
        </div>
        <div class="titlebar-drag">
          <time class="titlebar-clock" id="titlebar-clock"></time>
        </div>
        <button class="titlebar-btn" id="btn-reset-simulation" type="button">
          Reset Simulation
        </button>
        <div class="window-controls">
          <button class="window-btn" id="btn-minimize" type="button" aria-label="Minimize">
            <svg viewBox="0 0 12 12"><path d="M2 6h8" /></svg>
          </button>
          <button class="window-btn" id="btn-maximize" type="button" aria-label="Maximize">
            <svg viewBox="0 0 12 12"><rect x="2.5" y="2.5" width="7" height="7" rx="1" /></svg>
          </button>
          <button class="window-btn window-btn-close" id="btn-close" type="button" aria-label="Close">
            <svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3L3 9" /></svg>
          </button>
        </div>
      </header>

      <div class="workspace" id="workspace">
        <section class="sub-panel" data-panel="1">
          <div class="sub-panel-body camera-panel">
            <div class="panel-header-controls">
              <button class="panel-btn panel-toggle" type="button" aria-label="Disable panel" aria-pressed="true">
                <svg class="icon-enabled" viewBox="0 0 12 12" aria-hidden="true">
                  <circle cx="6" cy="6" r="3.75" fill="none" />
                  <circle cx="6" cy="6" r="1.35" fill="currentColor" stroke="none" />
                </svg>
                <svg class="icon-disabled hidden" viewBox="0 0 12 12" aria-hidden="true">
                  <circle cx="6" cy="6" r="3.75" fill="none" />
                  <path d="M3.5 8.5 8.5 3.5" />
                </svg>
              </button>
              <button class="panel-btn panel-maximize" type="button" aria-label="Maximize panel">
                <svg class="icon-maximize" viewBox="0 0 12 12"><rect x="2.5" y="2.5" width="7" height="7" rx="1" /></svg>
                <svg class="icon-restore hidden" viewBox="0 0 12 12"><path d="M4 2.5h5.5V8M8 4H2.5V9.5" /></svg>
              </button>
            </div>
            <canvas id="main-camera-canvas" aria-label="Main camera feed"></canvas>
            <div class="camera-crosshair" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <defs>
                  <linearGradient id="crosshair-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#00e5c0" stop-opacity="0.6" />
                    <stop offset="100%" stop-color="#0099ff" stop-opacity="0.6" />
                  </linearGradient>
                </defs>
                <path d="M12 5v14M5 12h14" stroke="url(#crosshair-gradient)" />
              </svg>
            </div>
            <div class="camera-pip">
              <button class="camera-swap-btn" id="camera-swap-btn" type="button" aria-label="Swap main camera">
                <svg viewBox="0 0 16 16" aria-hidden="true">
                  <path d="M5 2.5 2.5 5l2.5 2.5M11 13.5l2.5-2.5-2.5-2.5M2.75 5h10.5M13.25 11H2.75" />
                </svg>
              </button>
              <canvas id="pip-camera-canvas" aria-label="Picture-in-picture camera feed"></canvas>
            </div>
            <p class="camera-status" id="front-camera-status"><span class="sensor-status-dot is-waiting" aria-hidden="true"></span><span class="sensor-status-text">Waiting for camera…</span></p>
            <div class="robot-controls" aria-label="Robot controls">
              <div class="robot-cmd-group">
                <button class="robot-cmd-btn" type="button" data-cmd="select">Select</button>
                <button class="robot-cmd-btn" type="button" data-cmd="start">Start</button>
              </div>
              <div class="joystick" id="move-joystick" aria-label="Robot move joystick">
                <div class="joystick-base">
                  <span class="joystick-arrow joystick-arrow-up" aria-hidden="true">
                    <svg viewBox="0 0 12 12"><path d="M6 2.5 10 8H2z" /></svg>
                  </span>
                  <span class="joystick-arrow joystick-arrow-down" aria-hidden="true">
                    <svg viewBox="0 0 12 12"><path d="M6 9.5 2 4h8z" /></svg>
                  </span>
                  <span class="joystick-arrow joystick-arrow-left" aria-hidden="true">
                    <svg viewBox="0 0 12 12"><path d="M2.5 6 8 2v8z" /></svg>
                  </span>
                  <span class="joystick-arrow joystick-arrow-right" aria-hidden="true">
                    <svg viewBox="0 0 12 12"><path d="M9.5 6 4 2v8z" /></svg>
                  </span>
                  <div class="joystick-knob"></div>
                </div>
              </div>
              <div class="robot-cmd-group">
                <button class="robot-cmd-btn" type="button" data-cmd="stand-down">Stand Down</button>
                <button class="robot-cmd-btn" type="button" data-cmd="stand-up">Stand Up</button>
              </div>
            </div>
          </div>
        </section>

        <section class="sub-panel" data-panel="2">
          <div class="sub-panel-body lidar-panel">
            <div class="panel-header-controls">
              <button class="panel-btn panel-toggle" type="button" aria-label="Disable panel" aria-pressed="true">
                <svg class="icon-enabled" viewBox="0 0 12 12" aria-hidden="true">
                  <circle cx="6" cy="6" r="3.75" fill="none" />
                  <circle cx="6" cy="6" r="1.35" fill="currentColor" stroke="none" />
                </svg>
                <svg class="icon-disabled hidden" viewBox="0 0 12 12" aria-hidden="true">
                  <circle cx="6" cy="6" r="3.75" fill="none" />
                  <path d="M3.5 8.5 8.5 3.5" />
                </svg>
              </button>
              <button class="panel-btn panel-maximize" type="button" aria-label="Maximize panel">
                <svg class="icon-maximize" viewBox="0 0 12 12"><rect x="2.5" y="2.5" width="7" height="7" rx="1" /></svg>
                <svg class="icon-restore hidden" viewBox="0 0 12 12"><path d="M4 2.5h5.5V8M8 4H2.5V9.5" /></svg>
              </button>
            </div>
            <canvas id="lidar-canvas" aria-label="Lidar point cloud"></canvas>
            <p class="lidar-status" id="lidar-status"><span class="sensor-status-dot is-waiting" aria-hidden="true"></span><span class="sensor-status-text">Waiting for lidar…</span></p>
          </div>
        </section>

        <section class="sub-panel" data-panel="3">
          <div class="sub-panel-body camera-panel">
            <div class="panel-header-controls">
              <button class="panel-btn panel-toggle" type="button" aria-label="Disable panel" aria-pressed="true">
                <svg class="icon-enabled" viewBox="0 0 12 12" aria-hidden="true">
                  <circle cx="6" cy="6" r="3.75" fill="none" />
                  <circle cx="6" cy="6" r="1.35" fill="currentColor" stroke="none" />
                </svg>
                <svg class="icon-disabled hidden" viewBox="0 0 12 12" aria-hidden="true">
                  <circle cx="6" cy="6" r="3.75" fill="none" />
                  <path d="M3.5 8.5 8.5 3.5" />
                </svg>
              </button>
              <button class="panel-btn panel-maximize" type="button" aria-label="Maximize panel">
                <svg class="icon-maximize" viewBox="0 0 12 12"><rect x="2.5" y="2.5" width="7" height="7" rx="1" /></svg>
                <svg class="icon-restore hidden" viewBox="0 0 12 12"><path d="M4 2.5h5.5V8M8 4H2.5V9.5" /></svg>
              </button>
            </div>
            <canvas id="third-main-camera-canvas" aria-label="Third main camera feed"></canvas>
            <div class="camera-pip">
              <button class="camera-swap-btn" id="third-camera-swap-btn" type="button" aria-label="Swap third camera">
                <svg viewBox="0 0 16 16" aria-hidden="true">
                  <path d="M5 2.5 2.5 5l2.5 2.5M11 13.5l2.5-2.5-2.5-2.5M2.75 5h10.5M13.25 11H2.75" />
                </svg>
              </button>
              <canvas id="third-pip-camera-canvas" aria-label="Third picture-in-picture camera feed"></canvas>
            </div>
            <p class="camera-status" id="third-camera-status"><span class="sensor-status-dot is-waiting" aria-hidden="true"></span><span class="sensor-status-text">Waiting for camera…</span></p>
          </div>
        </section>

        <section class="sub-panel" data-panel="4">
          <div class="sub-panel-body world-panel">
            <div class="panel-header-controls">
              <button class="panel-btn panel-toggle" type="button" aria-label="Disable panel" aria-pressed="true">
                <svg class="icon-enabled" viewBox="0 0 12 12" aria-hidden="true">
                  <circle cx="6" cy="6" r="3.75" fill="none" />
                  <circle cx="6" cy="6" r="1.35" fill="currentColor" stroke="none" />
                </svg>
                <svg class="icon-disabled hidden" viewBox="0 0 12 12" aria-hidden="true">
                  <circle cx="6" cy="6" r="3.75" fill="none" />
                  <path d="M3.5 8.5 8.5 3.5" />
                </svg>
              </button>
              <button class="panel-btn panel-maximize" type="button" aria-label="Maximize panel">
                <svg class="icon-maximize" viewBox="0 0 12 12"><rect x="2.5" y="2.5" width="7" height="7" rx="1" /></svg>
                <svg class="icon-restore hidden" viewBox="0 0 12 12"><path d="M4 2.5h5.5V8M8 4H2.5V9.5" /></svg>
              </button>
            </div>
            <div class="world-view-toolbar" aria-label="World viewer controls">
              <button
                class="world-view-icon-btn"
                id="world-view-mode-btn"
                type="button"
                disabled
                aria-label="Transparent view"
                aria-pressed="false"
              >
                <svg class="world-view-icon world-view-icon-solid" viewBox="0 0 16 16" aria-hidden="true">
                  <path
                    fill="currentColor"
                    d="M8 2.25 13.25 5.5v5L8 13.75 2.75 10.5v-5z"
                  />
                </svg>
                <svg class="world-view-icon world-view-icon-outline" viewBox="0 0 16 16" aria-hidden="true">
                  <path
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.2"
                    stroke-linejoin="round"
                    d="M8 2.25 13.25 5.5v5L8 13.75 2.75 10.5v-5L8 2.25z"
                  />
                </svg>
              </button>
              <button
                class="world-view-icon-btn"
                id="world-robot-view-btn"
                type="button"
                aria-label="Robot model view"
                aria-pressed="false"
              >
                <svg class="world-view-icon world-view-icon-axis" viewBox="0 0 16 16" aria-hidden="true">
                  <path fill="none" stroke="#ff3b30" stroke-width="1.2" stroke-linecap="round" d="M8 8.5V3.25" />
                  <path fill="none" stroke="#34c759" stroke-width="1.2" stroke-linecap="round" d="M8 8.5 12.25 10.75" />
                  <path fill="none" stroke="#007aff" stroke-width="1.2" stroke-linecap="round" d="M8 8.5 3.75 10.75" />
                </svg>
                <svg class="world-view-icon world-view-icon-robot" viewBox="0 0 16 16" aria-hidden="true">
                  <rect
                    x="4.25"
                    y="5.25"
                    width="7.5"
                    height="4.25"
                    rx="1.1"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.2"
                  />
                  <circle cx="5.5" cy="10.75" r="0.9" fill="currentColor" />
                  <circle cx="10.5" cy="10.75" r="0.9" fill="currentColor" />
                  <circle cx="5.5" cy="12.35" r="0.75" fill="currentColor" />
                  <circle cx="10.5" cy="12.35" r="0.75" fill="currentColor" />
                </svg>
              </button>
              <button
                class="world-view-icon-btn"
                id="world-focus-robot-btn"
                type="button"
                aria-label="Focus robot"
              >
                <svg class="world-view-icon" viewBox="0 0 16 16" aria-hidden="true">
                  <circle cx="8" cy="8" r="2.25" fill="none" stroke="currentColor" stroke-width="1.2" />
                  <path
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.2"
                    stroke-linecap="round"
                    d="M8 2.25v2.25M8 11.5v2.25M2.25 8h2.25M11.5 8h2.25"
                  />
                </svg>
              </button>
              <button
                class="world-view-icon-btn"
                id="world-follow-btn"
                type="button"
                aria-label="Follow robot"
                aria-pressed="false"
              >
                <svg class="world-view-icon world-view-icon-free" viewBox="0 0 16 16" aria-hidden="true">
                  <path
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M3.75 5.75V3.75h2M10.25 3.75h2v2M12.25 10.25v2h-2M5.75 12.25h-2v-2"
                  />
                </svg>
                <svg class="world-view-icon world-view-icon-follow" viewBox="0 0 16 16" aria-hidden="true">
                  <path
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M3.75 5.75V3.75h2M10.25 3.75h2v2M12.25 10.25v2h-2M5.75 12.25h-2v-2"
                  />
                  <circle cx="8" cy="8" r="1.35" fill="currentColor" />
                </svg>
              </button>
            </div>
            <div id="world-viewer" class="world-viewer-host" aria-label="World model preview"></div>
            <p class="world-status" id="world-status"><span class="sensor-status-dot is-waiting" aria-hidden="true"></span><span class="sensor-status-text">Loading world model…</span></p>
          </div>
        </section>
      </div>
    </div>

    <script src="../../node_modules/roslib/build/roslib.min.js"></script>
    <script src="sensor-status.js"></script>
    <script src="camera.js"></script>
    <script src="lidar.js"></script>
    <script src="robot-control.js"></script>
    <script src="renderer.js"></script>
    <script src="world-viewer.bundle.js"></script>
    <script src="ros-shared.js"></script>
  </body>
</html>
